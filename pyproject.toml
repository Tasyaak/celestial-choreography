
[project]
name = "celestial-choreography"
version = "0.1.0"
description = "Numerical computation and visualization of periodic orbits in the n-body problem on 2D"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "matplotlib>=3.11.2",
    "manim>=0.22.0",
    "jax>=0.11.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/celestial"]
